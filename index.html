<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<meta name="apple-mobile-web-app-title" content="Our Trip 💕"/>
<meta name="theme-color" content="#fff8f2"/>
<title>Our Travel Book 💕</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Gaegu:wght@400;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet"/>
<style>
:root{--rose:#e8728a;--pink:#f4a7b9;--blush:#fce4ec;--cream:#fff8f2;--warm:#fdeee4;--peach:#f9c784;--brown:#7a4f3a;--ink:#3d2215;--muted:#a08878;--sage:#b8d4b0;--lav:#d4c5e8;--shadow:rgba(232,114,138,0.13);--r:16px;}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--cream);font-family:'Noto Sans KR',sans-serif;color:var(--ink);min-height:100vh;
  background-image:radial-gradient(ellipse at 10% 0%,rgba(244,167,185,.10) 0%,transparent 55%),
  radial-gradient(ellipse at 90% 100%,rgba(249,199,132,.08) 0%,transparent 55%);
  padding-bottom:env(safe-area-inset-bottom)}
body::before{content:'';display:block;height:5px;background:repeating-linear-gradient(90deg,var(--rose) 0 18px,var(--pink) 18px 36px,var(--peach) 36px 54px,var(--lav) 54px 72px,var(--sage) 72px 90px)}

/* INSTALL BANNER */
#install-banner{display:none;background:linear-gradient(135deg,var(--rose),#d45a75);color:white;padding:12px 16px;
  text-align:center;font-size:13px;font-weight:600;cursor:pointer;position:relative}
#install-banner .ib-close{position:absolute;right:14px;top:50%;transform:translateY(-50%);font-size:16px;opacity:.8}

/* COVER */
.cover{text-align:center;padding:36px 20px 20px}
.cover-eyebrow{font-size:11px;font-weight:700;letter-spacing:3px;color:var(--pink);text-transform:uppercase;margin-bottom:8px}
.cover-title{font-family:'Playfair Display',serif;font-size:clamp(30px,7vw,52px);color:var(--brown);line-height:1.15;margin-bottom:5px}
.cover-title em{font-style:italic;color:var(--rose)}
.cover-names{display:inline-flex;align-items:center;gap:10px;background:white;border:2px solid var(--blush);
  border-radius:40px;padding:8px 22px;box-shadow:0 4px 20px var(--shadow);font-size:13px;font-weight:700;color:var(--brown)}
.hrt{color:var(--rose);font-size:16px;animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.3)}}

/* NAV */
nav{position:sticky;top:0;z-index:200;background:rgba(255,248,242,.96);backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);border-bottom:1.5px solid var(--blush);
  display:flex;justify-content:center;flex-wrap:wrap;gap:3px;padding:8px 12px;box-shadow:0 2px 14px var(--shadow)}
.nb{background:none;border:2px solid transparent;border-radius:26px;padding:6px 14px;
  font-family:'Noto Sans KR',sans-serif;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;transition:all .2s}
.nb:hover{color:var(--rose);border-color:var(--blush)}
.nb.active{background:var(--rose);color:white;border-color:var(--rose);box-shadow:0 3px 10px rgba(232,114,138,.3)}

/* PAGES */
.page{display:none;max-width:760px;margin:0 auto;padding:24px 14px 80px}
.page.active{display:block;animation:fadeUp .3s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

/* SECTION TITLE */
.sec-title{font-family:'Playfair Display',serif;font-size:21px;color:var(--brown);margin-bottom:16px;
  display:flex;align-items:center;gap:10px}
.sec-title::after{content:'';flex:1;height:1.5px;background:linear-gradient(90deg,var(--pink),transparent)}

/* CARD */
.card{background:white;border-radius:var(--r);padding:16px 18px;
  box-shadow:0 4px 18px var(--shadow),0 1px 0 var(--blush);margin-bottom:12px;
  border:1.5px solid rgba(244,167,185,.2)}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:5px;border:none;border-radius:26px;
  padding:8px 16px;font-family:'Noto Sans KR',sans-serif;font-size:13px;font-weight:700;cursor:pointer;transition:all .2s;touch-action:manipulation}
.btn-primary{background:var(--rose);color:white;box-shadow:0 3px 10px rgba(232,114,138,.3)}
.btn-primary:hover{background:#d45a75}
.btn-primary:active{transform:scale(.97)}
.btn-ghost{background:white;color:var(--rose);border:2px solid var(--pink)}
.btn-ghost:hover{background:var(--blush)}
.btn-danger{background:#fff0f0;color:#c04040;border:2px solid #f0c0c0}
.btn-sm{padding:5px 11px;font-size:12px}
.btn-full{width:100%;justify-content:center}
.icon-btn{width:28px;height:28px;border-radius:50%;border:none;cursor:pointer;font-size:12px;
  display:flex;align-items:center;justify-content:center;background:var(--blush);color:var(--rose)}
.icon-btn-del{background:#fff0f0;color:#c04040}

/* TAGS */
.tag{font-size:10px;font-weight:700;padding:2px 8px;border-radius:18px}
.tag-pink{background:#fde8ee;color:var(--rose)}.tag-sage{background:#e4f0e0;color:#5a8a52}
.tag-gold{background:#fff3d0;color:#a07020}.tag-lav{background:#eee8f8;color:#7060a0}
.tag-blue{background:#e8f0fe;color:#4060c0}.tag-peach{background:#fde8d0;color:#c07040}

/* TRIP CARDS */
.trips-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-bottom:18px}
.trip-card{background:white;border-radius:var(--r);overflow:hidden;cursor:pointer;
  box-shadow:0 4px 16px var(--shadow);border:1.5px solid var(--blush);transition:all .2s;position:relative}
.trip-card:active{transform:scale(.98)}
.trip-card-cover{height:90px;display:flex;align-items:center;justify-content:center;font-size:44px}
.trip-card-body{padding:11px 13px 13px}
.trip-card-country{font-size:10px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:2px}
.trip-card-name{font-family:'Playfair Display',serif;font-size:16px;color:var(--brown);margin-bottom:2px}
.trip-card-date{font-size:11px;color:var(--muted);margin-bottom:7px}
.trip-card-actions{position:absolute;top:6px;right:6px;display:flex;gap:3px;opacity:0;transition:opacity .2s}
.trip-card:hover .trip-card-actions{opacity:1}
.status-badge{display:inline-block;font-size:10px;font-weight:700;padding:2px 8px;border-radius:18px}
.status-done{background:#e8f8e8;color:#4a8a4a}.status-plan{background:#fff8e0;color:#c09020}.status-future{background:#f0e8ff;color:#7060a0}
.add-trip-card{background:white;border:2.5px dashed var(--pink);border-radius:var(--r);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:185px;cursor:pointer;transition:all .2s;gap:6px;color:var(--pink)}
.add-trip-card:active{background:var(--blush)}

/* TRIP DETAIL */
.trip-detail-header{background:linear-gradient(135deg,var(--blush),var(--warm));
  border-radius:var(--r);padding:20px;margin-bottom:14px;text-align:center;border:1.5px solid var(--pink)}
.tdh-emoji{font-size:42px;margin-bottom:7px}
.tdh-name{font-family:'Playfair Display',serif;font-size:22px;color:var(--brown);margin-bottom:3px}
.tdh-meta{font-size:12px;color:var(--muted);margin-bottom:10px}
.sub-tabs{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:18px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:2px}
.stab{background:white;border:2px solid var(--blush);border-radius:22px;padding:6px 13px;
  font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;transition:all .2s;white-space:nowrap;flex-shrink:0}
.stab.active{background:var(--rose);color:white;border-color:var(--rose)}
.sub-page{display:none}
.sub-page.active{display:block;animation:fadeUp .2s ease both}

/* DATE TABS */
.date-tabs-wrap{display:flex;gap:5px;flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;
  margin-bottom:14px;padding-bottom:4px;align-items:center}
.date-tab{background:white;border:2px solid var(--blush);border-radius:20px;padding:5px 13px;
  font-size:12px;font-weight:700;color:var(--muted);cursor:pointer;transition:all .2s;white-space:nowrap;flex-shrink:0}
.date-tab.active{background:var(--rose);color:white;border-color:var(--rose)}
.date-tab-add{background:none;border:2px dashed var(--pink);border-radius:20px;padding:5px 13px;
  font-size:12px;font-weight:700;color:var(--pink);cursor:pointer;flex-shrink:0}

/* TIMELINE */
.timeline{position:relative;padding-left:32px}
.timeline::before{content:'';position:absolute;left:10px;top:4px;bottom:4px;width:2px;
  background:linear-gradient(to bottom,var(--pink),var(--peach));border-radius:2px}
.tl-item{position:relative;margin-bottom:9px;background:white;border-radius:12px;
  padding:11px 13px;border:1.5px solid rgba(244,167,185,.25);box-shadow:0 2px 10px var(--shadow);cursor:pointer}
.tl-item.open{border-color:var(--rose)}
.tl-dot{position:absolute;left:-25px;top:12px;width:20px;height:20px;border-radius:50%;
  background:var(--rose);color:white;font-size:9px;font-weight:800;
  display:flex;align-items:center;justify-content:center;border:3px solid var(--cream);box-shadow:0 0 0 2px var(--pink)}
.tl-head{display:flex;align-items:center;gap:7px}
.tl-icon{font-size:18px;flex-shrink:0}
.tl-name{font-weight:700;font-size:13px;color:var(--brown);flex:1}
.tl-chevron{color:var(--pink);font-size:11px;transition:transform .2s;flex-shrink:0}
.tl-item.open .tl-chevron{transform:rotate(180deg)}
.tl-body{display:none;margin-top:9px;padding-top:9px;border-top:1px dashed var(--blush)}
.tl-item.open .tl-body{display:block}
.tl-note{background:var(--blush);border-radius:7px;padding:7px 10px;font-size:12px;color:#7a4050;margin-top:7px;line-height:1.5}
.transport-row{display:flex;align-items:center;gap:6px;padding:3px 0}
.transport-row hr{flex:1;border:none;border-top:1.5px dashed #f0d0da}
.transport-pill{background:white;border:1.5px solid var(--blush);border-radius:16px;padding:2px 10px;
  font-size:10px;color:var(--muted);font-weight:600}
.cl{list-style:none;display:flex;flex-direction:column;gap:5px}
.cl li{display:flex;align-items:flex-start;gap:7px;font-size:13px;color:#5a3828;line-height:1.4;cursor:pointer}
.cl li.done{opacity:.4}
.cl li.done span{text-decoration:line-through}
.cl li.done .cb{background:var(--rose);border-color:var(--rose)}
.cb{width:16px;height:16px;border-radius:4px;border:2px solid var(--pink);flex-shrink:0;
  display:flex;align-items:center;justify-content:center;margin-top:2px;font-size:10px;color:white}
.dg-title{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.7px;margin-bottom:5px;margin-top:8px}

/* PRE-TRIP MEMO */
.pretip-section{margin-bottom:18px}
.memo-tabs{display:flex;gap:5px;margin-bottom:12px;flex-wrap:wrap}
.memo-tab{background:white;border:2px solid var(--blush);border-radius:20px;padding:5px 13px;
  font-size:12px;font-weight:700;color:var(--muted);cursor:pointer;transition:all .2s}
.memo-tab.active{background:var(--rose);color:white;border-color:var(--rose)}
.memo-content{display:none}
.memo-content.active{display:block}
.memo-card{background:white;border-radius:var(--r);padding:16px 18px;margin-bottom:10px;
  border:1.5px solid var(--blush);box-shadow:0 3px 14px var(--shadow)}
.memo-item{display:flex;align-items:flex-start;gap:9px;padding:8px 0;border-bottom:1px dashed var(--blush);font-size:13px;color:#5a3828}
.memo-item:last-child{border:none}
.memo-item-icon{font-size:16px;flex-shrink:0;margin-top:1px}
.memo-item-text{flex:1;line-height:1.5}
.memo-item-del{color:#d09090;font-size:12px;cursor:pointer;flex-shrink:0;background:none;border:none}
.memo-add-row{display:flex;gap:7px;margin-top:8px}
.memo-add-row input{flex:1;border:2px solid var(--blush);border-radius:9px;padding:8px 11px;font-size:13px;font-family:'Noto Sans KR',sans-serif;outline:none;color:var(--ink)}
.memo-add-row input:focus{border-color:var(--rose)}

/* CALENDAR */
.cal-wrap{background:white;border-radius:var(--r);padding:14px;margin-bottom:14px;
  box-shadow:0 4px 16px var(--shadow);border:1.5px solid var(--blush)}
.cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal-header h3{font-family:'Playfair Display',serif;font-size:15px;color:var(--brown)}
.cal-nav{background:none;border:none;font-size:18px;color:var(--pink);cursor:pointer;padding:3px 7px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal-dow{text-align:center;font-size:9px;font-weight:700;color:var(--muted);padding:2px 0}
.cal-day{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;
  border-radius:7px;cursor:pointer;transition:all .15s;position:relative;color:var(--ink)}
.cal-day.empty{cursor:default}
.cal-day.has-entry{background:var(--blush);color:var(--rose)}
.cal-day.has-entry::after{content:'';position:absolute;bottom:2px;left:50%;transform:translateX(-50%);width:4px;height:4px;border-radius:50%;background:var(--rose)}
.cal-day.selected{background:var(--rose)!important;color:white!important}
.cal-day.today{font-weight:800;border:2px solid var(--pink)}

/* DIARY */
.diary-writer-tabs{display:flex;gap:5px;margin-bottom:12px;flex-wrap:wrap}
.writer-tab{background:white;border:2px solid var(--blush);border-radius:20px;padding:5px 14px;font-size:12px;font-weight:700;color:var(--muted);cursor:pointer;transition:all .2s}
.wt-all.active,.wt-me.active{background:var(--rose);color:white;border-color:var(--rose)}
.wt-partner.active{background:#7060a0;color:white;border-color:#7060a0}
.diary-entry{background:white;border-radius:var(--r);padding:18px 20px;margin-bottom:11px;
  border:1.5px solid var(--blush);box-shadow:0 3px 14px var(--shadow);position:relative}
.diary-entry.partner{border-color:#d4c5e8}
.diary-entry::before{content:'"';font-family:'Playfair Display',serif;font-size:58px;color:var(--blush);position:absolute;top:-5px;left:11px;line-height:1;pointer-events:none}
.diary-entry.partner::before{color:#d4c5e8}
.diary-writer-badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:2px 10px;border-radius:18px;margin-bottom:6px}
.badge-me{background:#fde8ee;color:var(--rose)}.badge-partner{background:#eee8f8;color:#7060a0}
.diary-date-lbl{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:1px;margin-bottom:4px}
.diary-title-txt{font-family:'Playfair Display',serif;font-size:16px;color:var(--brown);margin-bottom:8px}
.diary-body-txt{font-size:13px;color:#5a3828;line-height:1.85;white-space:pre-wrap}
.diary-mood-txt{display:inline-flex;align-items:center;gap:4px;margin-top:9px;background:var(--blush);border-radius:16px;padding:3px 11px;font-size:12px;color:var(--rose);font-weight:700}
.diary-entry.partner .diary-mood-txt{background:#eee8f8;color:#7060a0}
.diary-actions{display:flex;gap:5px;margin-top:9px;justify-content:flex-end}

/* PHOTO UPLOAD */
.photo-upload-area{border:2.5px dashed var(--pink);border-radius:var(--r);padding:24px;
  text-align:center;cursor:pointer;transition:all .2s;background:white;margin-bottom:14px;position:relative}
.photo-upload-area:hover,.photo-upload-area.drag-over{background:var(--blush);border-color:var(--rose)}
.photo-upload-area input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.pua-emoji{font-size:36px;margin-bottom:8px}
.pua-text{font-size:14px;font-weight:700;color:var(--rose);margin-bottom:4px}
.pua-sub{font-size:12px;color:var(--muted)}
.photo-date-header{font-family:'Gaegu',cursive;font-size:16px;color:var(--brown);margin-bottom:9px;display:flex;align-items:center;gap:7px}
.photo-date-header::after{content:'';flex:1;height:1px;background:var(--blush)}
.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:14px}
.photo-wrap{display:flex;flex-direction:column;gap:3px}
.photo-slot{aspect-ratio:1;background:var(--warm);border-radius:8px;border:2px dashed #f0c8d0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  overflow:hidden;position:relative}
.photo-slot img{width:100%;height:100%;object-fit:cover;border-radius:6px}
.photo-tape{position:absolute;top:-4px;left:50%;transform:translateX(-50%);width:32px;height:10px;border-radius:2px}
.photo-del-btn{position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;
  background:rgba(255,255,255,.9);border:none;cursor:pointer;font-size:11px;
  display:flex;align-items:center;justify-content:center;color:#c04040;box-shadow:0 1px 4px rgba(0,0,0,.15)}
.photo-caption{font-size:10px;color:var(--muted);text-align:center;font-style:italic}
.upload-progress{background:var(--blush);border-radius:8px;padding:10px 14px;font-size:12px;color:var(--rose);font-weight:700;margin-bottom:10px;display:none}

/* EXPENSES */
.exp-summary-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:12px}
.exp-box{background:white;border-radius:12px;padding:11px 9px;text-align:center;border:1.5px solid var(--blush);box-shadow:0 2px 10px var(--shadow)}
.exp-amount{font-family:'Playfair Display',serif;font-size:17px;font-weight:700;color:var(--rose)}
.exp-label{font-size:10px;color:var(--muted);margin-top:1px}
table.exp-table{width:100%;border-collapse:collapse;background:white;border-radius:12px;overflow:hidden;box-shadow:0 2px 12px var(--shadow);margin-bottom:11px}
table.exp-table th{background:linear-gradient(135deg,var(--rose),#d45a75);color:white;font-size:11px;font-weight:700;padding:8px 9px;text-align:left}
table.exp-table td{padding:8px 9px;font-size:12px;color:#5a3828;border-bottom:1px solid var(--blush)}
table.exp-table tr:last-child td{border:none}
.exp-total-row td{font-weight:800;color:var(--rose);background:var(--blush)!important}
.chart-wrap{background:white;border-radius:var(--r);padding:16px 18px;margin-bottom:12px;box-shadow:0 4px 16px var(--shadow);border:1.5px solid var(--blush)}
.chart-title{font-family:'Playfair Display',serif;font-size:15px;color:var(--brown);margin-bottom:12px}
.donut-wrap{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:14px}
.chart-legend{display:flex;flex-direction:column;gap:5px;flex:1}
.legend-item{display:flex;align-items:center;gap:6px;font-size:12px}
.legend-dot{width:10px;height:10px;border-radius:3px;flex-shrink:0}
.legend-pct{font-weight:700;color:var(--brown);margin-left:auto}
.bar-chart{display:flex;flex-direction:column;gap:7px}
.bar-row{display:flex;align-items:center;gap:7px}
.bar-label{font-size:11px;color:var(--ink);width:70px;flex-shrink:0;text-align:right}
.bar-track{flex:1;height:10px;background:#f0e8e0;border-radius:5px;overflow:hidden}
.bar-fill{height:100%;border-radius:5px;transition:width .6s ease}
.bar-val{font-size:11px;color:var(--muted);width:50px;flex-shrink:0}

/* MODALS */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(60,20,10,.45);z-index:1000;
  align-items:flex-end;justify-content:center;padding:0}
.modal-overlay.open{display:flex;animation:fadeIn .2s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{background:white;border-radius:20px 20px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom));
  width:100%;max-width:540px;box-shadow:0 -10px 40px rgba(0,0,0,.15);max-height:90vh;overflow-y:auto}
.modal-handle{width:40px;height:4px;background:#e0d0c8;border-radius:2px;margin:0 auto 16px}
.modal h3{font-family:'Playfair Display',serif;font-size:18px;color:var(--brown);margin-bottom:16px}
.form-group{margin-bottom:11px}
.form-group label{display:block;font-size:11px;font-weight:700;color:var(--muted);margin-bottom:3px;text-transform:uppercase;letter-spacing:.5px}
.form-group input,.form-group textarea,.form-group select{width:100%;border:2px solid var(--blush);border-radius:9px;padding:9px 11px;font-family:'Noto Sans KR',sans-serif;font-size:14px;color:var(--ink);background:white;transition:border-color .2s;outline:none;-webkit-appearance:none}
.form-group input:focus,.form-group textarea:focus,.form-group select:focus{border-color:var(--rose)}
.form-group textarea{resize:vertical;min-height:80px;line-height:1.6}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.modal-actions{display:flex;gap:7px;justify-content:flex-end;margin-top:14px}
.ep-picker{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px}

function checkInstall(){
  const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent);
  const isStandalone=window.navigator.standalone===true;
  const dismissed=localStorage.getItem('banner_dismissed');
  if(isIOS&&!isStandalone&&!dismissed){
    document.getElementById('install-banner').style.display='block';
  }
}
window.dismissBanner=function(){
  document.getElementById('install-banner').style.display='none';
  localStorage.setItem('banner_dismissed','1');

// ── PRE-TRIP MEMO ──
const MEMO_CATS=['준비물','기대','주의','예산','숙소','기타'];
let curMemoTab='준비물';

function renderPreTip(trip){
  const el=document.getElementById('sub-pretip');
  if(!trip.pretip)trip.pretip={memos:[]};
  const memos=trip.pretip.memos||[];
  let html=`<div class="memo-tabs">
    ${MEMO_CATS.map(c=>`<button class="memo-tab ${c===curMemoTab?'active':''}" onclick="switchMemoTab('${c}',this)">${MEMO_ICONS[c]} ${c}</button>`).join('')}
  </div>`;
  MEMO_CATS.forEach(cat=>{
    const items=memos.filter(m=>m.cat===cat);
    html+=`<div class="memo-content ${cat===curMemoTab?'active':''}" id="memo-cat-${cat}">
      <div class="memo-card">
        ${items.length?items.map(m=>`<div class="memo-item">
          <span class="memo-item-icon">${MEMO_ICONS[m.cat]}</span>
          <span class="memo-item-text">${m.text}</span>
          <button class="memo-item-del" onclick="deleteMemo('${m.id}')">✕</button>
        </div>`).join(''):
        `<div style="text-align:center;padding:20px 10px;color:var(--muted);font-size:13px">아직 ${cat} 메모가 없어요<br/>추가해봐요!</div>`}
        <div class="memo-add-row">
          <input type="text" id="memo-input-${cat}" placeholder="${cat} 메모 입력..." onkeydown="if(event.key==='Enter')addMemoInline('${cat}')"/>
          <button class="btn btn-primary btn-sm" onclick="addMemoInline('${cat}')">추가</button>
        </div>
      </div>
    </div>`;
  });
  el.innerHTML=html;
}

window.switchMemoTab=function(cat,btn){
  curMemoTab=cat;
  document.querySelectorAll('.memo-tab').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('.memo-content').forEach(c=>c.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('memo-cat-'+cat)?.classList.add('active');

window.addMemoInline=function(cat){
  const input=document.getElementById('memo-input-'+cat);
  const text=input?.value.trim();if(!text)return;
  const trip=DB.trips.find(t=>t.id===CTI);if(!trip)return;
  if(!trip.pretip)trip.pretip={memos:[]};
  trip.pretip.memos.push({id:uid(),cat,text});
  save();input.value='';renderPreTip(trip);
};

window.deleteMemo=function(id){
  const trip=DB.trips.find(t=>t.id===CTI);if(!trip)return;
  trip.pretip.memos=trip.pretip.memos.filter(m=>m.id!==id);
  save();renderPreTip(trip);
};

// ── ROUTE ──
function renderRoute(trip){
  const el=document.getElementById('sub-route');
  const cc={쇼핑:'tag-pink',식사:'tag-peach',관광:'tag-sage',이동:'tag-lav',숙박:'tag-lav',위스키:'tag-gold',기타:'tag-blue'};
  let html=dateTabs(trip,'setRD');
  if(!trip.dates.length){html+=`<div class="empty-state"><div class="es-emoji">📅</div><p>날짜를 먼저 추가해봐요!</p></div>`;}
  else if(!curDK){html+=`<div class="empty-state"><div class="es-emoji">📅</div><p>날짜를 선택해봐요!</p></div>`;}
  else{
    const stops=trip.stops[curDK]||[];
    if(!stops.length){html+=`<div class="empty-state"><div class="es-emoji">🗺️</div><p>이 날의 장소가 없어요!</p></div>`;}
    else{
      html+=`<div class="timeline">`;
      stops.forEach((s,i)=>{
        const tr=s.transport&&i>0?`<div class="transport-row"><hr/><div class="transport-pill">${s.transport}</div><hr/></div>`:'';
        let b='';
        if(s.todo?.length){b+=`<div class="dg-title">✅ 할 것</div><ul class="cl">${s.todo.map(x=>`<li onclick="this.classList.toggle('done')"><div class="cb">✓</div><span>${x}</span></li>`).join('')}</ul>`;}
        if(s.buy?.length){b+=`<div class="dg-title">🛍️ 살 것</div><ul class="cl">${s.buy.map(x=>`<li onclick="this.classList.toggle('done')"><div class="cb">✓</div><span>${x}</span></li>`).join('')}</ul>`;}
        if(s.eat?.length){b+=`<div class="dg-title">🍽️ 먹을 것</div><ul class="cl">${s.eat.map(x=>`<li onclick="this.classList.toggle('done')"><div class="cb">✓</div><span>${x}</span></li>`).join('')}</ul>`;}
        if(s.note){b+=`<div class="tl-note">💡 ${s.note}</div>`;}
        html+=`${i>0?tr:''}<div class="tl-item" id="tl-${s.id}" onclick="toggleTl('${s.id}')">
          <div class="tl-dot">${i+1}</div>
          <div class="tl-head"><span class="tl-icon">${s.icon}</span><span class="tl-name">${s.name}</span>
            ${s.time?`<span style="font-size:10px;color:#aaa">${s.time}</span>`:''}
            <span class="tag ${cc[s.cat]||'tag-blue'}" style="font-size:10px">${s.cat}</span>
            <span class="tl-chevron">▼</span></div>
          <div class="tl-body">${b}
            <div class="flex-gap mt-8">
              <button class="btn btn-ghost btn-sm" onclick="event.stopPropagation();editStop('${s.id}')">✏️ 수정</button>
              <button class="btn btn-danger btn-sm" onclick="event.stopPropagation();deleteStop('${s.id}')">🗑️</button>
            </div></div></div>`;
      });
      html+=`</div>`;
    }
  }
  html+=`<div class="flex-gap mt-12"><button class="btn btn-primary" onclick="openStopModal()">＋ 장소 추가</button></div>`;
  el.innerHTML=html;
}

window.toggleTl=function(id){const el=document.getElementById('tl-'+id);if(!el)return;const o=el.classList.contains('open');document.querySelectorAll('.tl-item').forEach(e=>e.classList.remove('open'));if(!o)el.classList.add('open');};

window.openDateModal=function(){document.getElementById('md-label').value='';document.getElementById('md-key').value='';openModal('modal-date');};

window.openStopModal=function(){editId=null;document.getElementById('ms-title').textContent='장소 추가 📍';['st-name','st-time','st-transport','st-note'].forEach(i=>document.getElementById(i).value='');document.getElementById('st-icon').value='📍';['st-todo','st-buy','st-eat'].forEach(i=>document.getElementById(i).value='');openModal('modal-stop');};
window.editStop=function(id){
  const trip=DB.trips.find(t=>t.id===CTI);let s=null;
  Object.values(trip.stops||{}).forEach(arr=>{const f=arr.find(x=>x.id===id);if(f)s=f;});

  document.getElementById('st-buy').value=(s.buy||[]).join('\n');

  document.getElementById('st-note').value=s.note||'';openModal('modal-stop');
};
window.saveStop=function(){
  const trip=DB.trips.find(t=>t.id===CTI);if(!trip||!curDK)return;
  if(!trip.stops[curDK])trip.stops[curDK]=[];
  const L=i=>document.getElementById(i).value.split('\n').map(l=>l.trim()).filter(Boolean);

window.deleteStop=function(id){

};

// ── DIARY ──
function renderDiary(trip){
  const el=document.getElementById('sub-diary');
  const ed=new Set((trip.diary||[]).map(e=>e.dateKey).filter(Boolean));
  let html=`<div class="cal-wrap">${buildCal(ed)}</div>`;
  html+=`<div class="diary-writer-tabs">
    <button class="writer-tab wt-all active" onclick="filterD('all',this)">👥 모두</button>
    <button class="writer-tab wt-me" onclick="filterD('me',this)">💕 ${DB.settings.name1}</button>
    <button class="writer-tab wt-partner" onclick="filterD('partner',this)">💜 ${DB.settings.name2}</button>
  </div><div id="diary-list">${dEntries(trip.diary||[],'all')}</div>`;
  html+=`<button class="btn btn-primary mt-12" onclick="openDiaryModal()">✏️ 일기 쓰기</button>`;
  el.innerHTML=html;
}
function dEntries(entries,writer){
  const f=writer==='all'?entries:entries.filter(e=>e.writer===writer);
  if(!f.length)return`<div class="empty-state"><div class="es-emoji">📖</div><p>아직 일기가 없어요!</p></div>`;
  return f.map(e=>`<div class="diary-entry ${e.writer==='partner'?'partner':''}">
    <div class="diary-writer-badge ${e.writer==='partner'?'badge-partner':'badge-me'}">${e.writer==='partner'?'💜 '+DB.settings.name2:'💕 '+DB.settings.name1}</div>
    <div class="diary-date-lbl">${e.dateLabel||''}</div>
    <div class="diary-title-txt">${e.title}</div>
    <div class="diary-body-txt">${e.body}</div>
    <div class="diary-mood-txt">${e.mood}</div>
    <div class="diary-actions">
      <button class="btn btn-ghost btn-sm" onclick="editDiary('${e.id}')">✏️</button>
      <button class="btn btn-danger btn-sm" onclick="deleteDiary('${e.id}')">🗑️</button>
    </div></div>`).join('');
}
window.filterD=function(w,btn){
  document.querySelectorAll('.writer-tab').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  const trip=DB.trips.find(t=>t.id===CTI);
  document.getElementById('diary-list').innerHTML=dEntries(trip.diary||[],w);
};
function buildCal(ed){
  const dim=new Date(calY,calM+1,0).getDate();
  const fd=new Date(calY,calM,1).getDay();
  const tod=new Date();
  return`<div class="cal-header"><button class="cal-nav" onclick="calPrev()">‹</button><h3>${calY}년 ${calM+1}월</h3><button class="cal-nav" onclick="calNext()">›</button></div>
  <div class="cal-grid">${['일','월','화','수','목','금','토'].map(d=>`<div class="cal-dow">${d}</div>`).join('')}
    ${Array(fd).fill('<div class="cal-day empty"></div>').join('')}
    ${Array.from({length:dim},(_,i)=>{
      const day=i+1,k=`${calY}-${String(calM+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
      const isT=tod.getFullYear()===calY&&tod.getMonth()===calM&&tod.getDate()===day;
      return`<div class="cal-day ${ed.has(k)?'has-entry':''} ${isT?'today':''}" onclick="calClick('${k}',${day})">${day}</div>`;
    }).join('')}
  </div>`;
}
window.calPrev=function(){calM--;if(calM<0){calM=11;calY--;}const t=DB.trips.find(x=>x.id===CTI);if(t)renderDiary(t);};
window.calNext=function(){calM++;if(calM>11){calM=0;calY++;}const t=DB.trips.find(x=>x.id===CTI);if(t)renderDiary(t);};
window.calClick=function(k,day){
  const trip=DB.trips.find(t=>t.id===CTI);if(!trip)return;
  document.querySelectorAll('.cal-day').forEach(d=>d.classList.remove('selected'));
  event.currentTarget.classList.add('selected');
  const ents=trip.diary.filter(e=>e.dateKey===k);
  document.getElementById('diary-list').innerHTML=ents.length?dEntries(ents,'all'):`<div class="empty-state"><div class="es-emoji">📖</div><p>${calM+1}월 ${day}일 일기가 없어요<br/>지금 써볼까요?</p></div>`;
};
window.openDiaryModal=function(){editId=null;document.getElementById('mdi-title').textContent='일기 쓰기 📖';['di-date','di-title','di-body','di-mood'].forEach(i=>document.getElementById(i).value='');document.getElementById('di-writer').value='me';openModal('modal-diary');};
window.editDiary=function(id){const trip=DB.trips.find(t=>t.id===CTI);const d=trip?.diary.find(x=>x.id===id);if(!d)return;editId=id;document.getElementById('mdi-title').textContent='일기 수정 ✏️';document.getElementById('di-writer').value=d.writer;document.getElementById('di-date').value=d.dateLabel||'';document.getElementById('di-title').value=d.title;document.getElementById('di-body').value=d.body;document.getElementById('di-mood').value=d.mood;openModal('modal-diary');};
window.saveDiary=function(){
  const trip=DB.trips.find(t=>t.id===CTI);if(!trip)return;
  const dl=document.getElementById('di-date').value.trim();
  const dk=dl.replace(/[^0-9]/g,'-')||uid();
  const data={writer:document.getElementById('di-writer').value,dateLabel:dl,dateKey:dk,title:document.getElementById('di-title').value.trim()||'오늘의 기록',body:document.getElementById('di-body').value.trim(),mood:document.getElementById('di-mood').value.trim()||'💕'};
  if(editId){const d=trip.diary.find(x=>x.id===editId);Object.assign(d,data);}else trip.diary.push({id:uid(),...data});
  save();closeModal('modal-diary');renderDiary(trip);
};
window.deleteDiary=function(id){if(!confirm('삭제?'))return;const trip=DB.trips.find(t=>t.id===CTI);trip.diary=trip.diary.filter(x=>x.id!==id);save();renderDiary(trip);};

// ── EXPENSES ──
function renderExpenses(trip){
  const el=document.getElementById('sub-expenses');
  const exps=trip.expenses||[];
  const totalK=exps.reduce((s,e)=>s+toK(e.amount,e.currency),0);
  const totalA=exps.reduce((s,e)=>s+toA(e.amount,e.currency),0).toFixed(2);
  const byCur={};exps.forEach(e=>{if(!byCur[e.currency])byCur[e.currency]=0;byCur[e.currency]+=e.amount;});
  let html=`<div class="exp-summary-grid">
    <div class="exp-box"><div class="exp-amount">₩${totalK.toLocaleString()}</div><div class="exp-label">원화 환산</div></div>
    <div class="exp-box"><div class="exp-amount">AED ${totalA}</div><div class="exp-label">디르함 환산</div></div>
    ${Object.entries(byCur).map(([c,a])=>`<div class="exp-box"><div class="exp-amount" style="font-size:14px">${c} ${a.toLocaleString()}</div><div class="exp-label">실제 지출</div></div>`).join('')}
  </div>`;
  const byCat={};exps.forEach(e=>{if(!byCat[e.cat])byCat[e.cat]=0;byCat[e.cat]+=toK(e.amount,e.currency);});
  const ce=Object.entries(byCat).sort((a,b)=>b[1]-a[1]);
  const colors=Object.values(CAT_C);
  if(ce.length&&totalK>0){
    html+=`<div class="chart-wrap"><div class="chart-title">📊 카테고리별 지출</div>
      <div class="donut-wrap"><canvas id="donutChart" width="140" height="140"></canvas>
        <div class="chart-legend">${ce.map((e,i)=>{const p=Math.round(e[1]/totalK*100);return`<div class="legend-item"><div class="legend-dot" style="background:${colors[i%colors.length]}"></div><span>${e[0]}</span><span class="legend-pct">${p}%</span></div>`;}).join('')}</div>
      </div>
      <div class="bar-chart">${ce.map((e,i)=>{const p=Math.round(e[1]/totalK*100);return`<div class="bar-row"><div class="bar-label">${e[0].split(' ').slice(1).join('')||e[0]}</div><div class="bar-track"><div class="bar-fill" style="width:${p}%;background:${colors[i%colors.length]}"></div></div><div class="bar-val">₩${(e[1]/1000).toFixed(0)}k</div></div>`;}).join('')}
      </div></div>`;
  }
  html+=dateTabs(trip,'setED');
  const fe=curDK?exps.filter(e=>e.dateKey===curDK):exps;
  if(fe.length){
    html+=`<table class="exp-table"><thead><tr><th>날짜</th><th>항목</th><th>카테고리</th><th>금액</th><th>₩</th><th></th></tr></thead><tbody>
      ${fe.map(e=>`<tr>
        <td style="font-size:10px;color:var(--muted)">${e.dateLabel||'-'}</td>
        <td>${e.name}${e.note?`<br/><span style="font-size:10px;color:#aaa">${e.note}</span>`:''}</td>
        <td><span class="tag tag-pink" style="font-size:10px">${e.cat}</span></td>
        <td style="font-weight:600;font-size:12px">${e.currency} ${e.amount.toLocaleString()}</td>
        <td style="font-size:11px;color:var(--muted)">₩${toK(e.amount,e.currency).toLocaleString()}</td>
        <td><div class="flex-gap"><button class="icon-btn" style="width:23px;height:23px;font-size:11px" onclick="editExpense('${e.id}')">✏️</button><button class="icon-btn icon-btn-del" style="width:23px;height:23px;font-size:11px" onclick="deleteExpense('${e.id}')">🗑️</button></div></td>
      </tr>`).join('')}
      <tr class="exp-total-row"><td colspan="3">💴 합계</td><td colspan="2">₩${fe.reduce((s,e)=>s+toK(e.amount,e.currency),0).toLocaleString()}</td><td></td></tr>
    </tbody></table>`;
  }else{html+=`<div class="empty-state"><div class="es-emoji">💴</div><p>지출 내역이 없어요!</p></div>`;}
  html+=`<div class="flex-gap mt-12"><button class="btn btn-primary" onclick="openExpenseModal()">＋ 지출 추가</button></div><div style="font-size:11px;color:var(--muted);margin-top:6px">💡 환율 참고: 1 AED ≈ ₩370 · 1 JPY ≈ ₩9.3</div>`;
  el.innerHTML=html;
  if(ce.length&&totalK>0)setTimeout(()=>drawDonut(ce,colors,totalK),60);
}
function drawDonut(ce,colors,total){
  const cv=document.getElementById('donutChart');if(!cv)return;
  const ctx=cv.getContext('2d'),cx=70,cy=70,r=56,ir=35;
  let s=-Math.PI/2;ctx.clearRect(0,0,140,140);
  ce.forEach((e,i)=>{const a=(e[1]/total)*2*Math.PI;ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,r,s,s+a);ctx.closePath();ctx.fillStyle=colors[i%colors.length];ctx.fill();s+=a;});
  ctx.beginPath();ctx.arc(cx,cy,ir,0,2*Math.PI);ctx.fillStyle='white';ctx.fill();
  ctx.fillStyle='#8b6355';ctx.font='bold 10px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText('지출',cx,cy-5);ctx.fillText('분석',cx,cy+5);
}
window.setED=function(k){curDK=k;const t=DB.trips.find(x=>x.id===CTI);if(t)renderExpenses(t);};
window.openExpenseModal=function(){editId=null;document.getElementById('mex-title').textContent='지출 추가 💴';['ex-name','ex-note','ex-date'].forEach(i=>document.getElementById(i).value='');document.getElementById('ex-amount').value='';document.getElementById('ex-currency').value='AED';openModal('modal-expense');};
window.editExpense=function(id){const trip=DB.trips.find(t=>t.id===CTI);const e=trip?.expenses.find(x=>x.id===id);if(!e)return;editId=id;document.getElementById('mex-title').textContent='지출 수정 ✏️';document.getElementById('ex-date').value=e.dateLabel||'';document.getElementById('ex-name').value=e.name;document.getElementById('ex-amount').value=e.amount;document.getElementById('ex-currency').value=e.currency;document.getElementById('ex-cat').value=e.cat;document.getElementById('ex-note').value=e.note||'';openModal('modal-expense');};
window.saveExpense=function(){
  const trip=DB.trips.find(t=>t.id===CTI);if(!trip)return;
  const dl=document.getElementById('ex-date').value.trim();
  const data={dateLabel:dl,dateKey:dl.replace(/[^0-9]/g,'-')||uid(),name:document.getElementById('ex-name').value.trim()||'지출',amount:parseFloat(document.getElementById('ex-amount').value)||0,currency:document.getElementById('ex-currency').value,cat:document.getElementById('ex-cat').value,note:document.getElementById('ex-note').value.trim()};
  if(editId){const e=trip.expenses.find(x=>x.id===editId);Object.assign(e,data);}else trip.expenses.push({id:uid(),...data});
  save();closeModal('modal-expense');renderExpenses(trip);
};
window.deleteExpense=function(id){if(!confirm('삭제?'))return;const trip=DB.trips.find(t=>t.id===CTI);trip.expenses=trip.expenses.filter(x=>x.id!==id);save();renderExpenses(trip);};

// ── PHOTOS (iPhone upload) ──
function renderPhotos(trip){
  const el=document.getElementById('sub-photos');
  const tapes=['rgba(255,220,100,.55)','rgba(255,180,200,.55)','rgba(180,210,240,.55)'];
  let html=dateTabs(trip,'setPD');
  if(!trip.dates.length){
    html+=`<div class="empty-state"><div class="es-emoji">📅</div><p>날짜를 먼저 추가해봐요!</p></div>`;
  }else{
    const dk=curDK||trip.dates[0]?.key;
    const photos=trip.photos[dk]||[];
    const lbl=trip.dates.find(d=>d.key===dk)?.label||'';
    // Upload area — accepts multiple, image/* for iPhone camera roll
    html+=`<div id="upload-progress" class="upload-progress">사진 업로드 중... 잠깐만요 🌸</div>
    <div class="photo-upload-area" id="upload-area-${dk}">
      <input type="file" accept="image/*" multiple onchange="handleUpload(event,'${dk}')" id="file-input-${dk}"/>
      <div class="pua-emoji">📷</div>
      <div class="pua-text">사진 선택하기</div>
      <div class="pua-sub">아이폰 사진첩에서 여러 장 한번에 선택 가능 📱</div>
    </div>
    <div><div class="photo-date-header">📅 ${lbl}</div>
      <div class="photo-grid">
        ${photos.map((p,i)=>`<div class="photo-wrap">
          <div class="photo-slot">
            <div class="photo-tape" style="background:${tapes[i%3]}"></div>
            <img src="${p.data||p.url||''}" alt="${p.caption}" loading="lazy"/>
            <button class="photo-del-btn" onclick="deletePhoto('${p.id}','${dk}')">✕</button>
          </div>
          <div class="photo-caption">${p.caption}</div>
        </div>`).join('')}
      </div>
      ${photos.length===0?`<div class="empty-state"><div class="es-emoji">🖼️</div><p>아직 사진이 없어요<br/>위에서 업로드해봐요!</p></div>`:''}
    </div>`;
  }
  html+=`<div style="font-size:11px;color:var(--muted);margin-top:10px;text-align:center">💡 사진은 기기에 저장돼요 · 많은 사진은 저장 공간을 사용해요</div>`;
  el.innerHTML=html;
}

window.handleUpload=function(event,dk){
  const trip=DB.trips.find(t=>t.id===CTI);if(!trip)return;
  if(!trip.photos[dk])trip.photos[dk]=[];
  const files=Array.from(event.target.files);if(!files.length)return;
  const prog=document.getElementById('upload-progress');
  if(prog)prog.style.display='block';
  let done=0;
  files.forEach(file=>{
    const reader=new FileReader();
    reader.onload=e=>{
      trip.photos[dk].push({id:uid(),data:e.target.result,caption:file.name.replace(/\.[^.]+$/,''),url:''});
      done++;
      if(prog)prog.textContent=`사진 업로드 중... ${done}/${files.length} 🌸`;
      if(done===files.length){
        save();if(prog)prog.style.display='none';renderPhotos(trip);
      }
    };
    reader.readAsDataURL(file);
  });
};

window.setPD=function(k){curDK=k;const t=DB.trips.find(x=>x.id===CTI);if(t)renderPhotos(t);};
window.deletePhoto=function(id,dk){if(!confirm('삭제?'))return;const trip=DB.trips.find(t=>t.id===CTI);trip.photos[dk]=(trip.photos[dk]||[]).filter(p=>p.id!==id);save();renderPhotos(trip);};
