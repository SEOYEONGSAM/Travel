<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Our Travel Book 💕</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Gaegu:wght@400;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet"/>
<style>
:root {
  --rose:#e8728a; --pink:#f4a7b9; --blush:#fce4ec;
  --cream:#fff8f2; --warm:#fdeee4; --peach:#f9c784;
  --brown:#7a4f3a; --ink:#3d2215; --muted:#a08878;
  --sage:#b8d4b0; --lav:#d4c5e8; --white:#fff;
  --shadow:rgba(232,114,138,0.15);
  --radius:18px;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
body{background:var(--cream);font-family:'Noto Sans KR',sans-serif;color:var(--ink);min-height:100vh;
  background-image:radial-gradient(ellipse at 10% 0%,rgba(244,167,185,.10) 0%,transparent 55%),
  radial-gradient(ellipse at 90% 100%,rgba(249,199,132,.08) 0%,transparent 55%)}
body::before{content:'';display:block;height:5px;
  background:repeating-linear-gradient(90deg,var(--rose) 0 18px,var(--pink) 18px 36px,var(--peach) 36px 54px,var(--lav) 54px 72px,var(--sage) 72px 90px)}

/* COVER */
.cover{text-align:center;padding:48px 20px 28px;position:relative}
.cover-eyebrow{font-size:11px;font-weight:700;letter-spacing:3px;color:var(--pink);text-transform:uppercase;margin-bottom:12px}
.cover-title{font-family:'Playfair Display',serif;font-size:clamp(34px,8vw,60px);color:var(--brown);line-height:1.15;margin-bottom:6px}
.cover-title em{font-style:italic;color:var(--rose)}
.cover-sub{font-family:'Gaegu',cursive;font-size:18px;color:var(--muted);margin-bottom:18px}
.cover-names{display:inline-flex;align-items:center;gap:12px;background:white;border:2px solid var(--blush);
  border-radius:40px;padding:10px 28px;box-shadow:0 4px 20px var(--shadow);font-size:15px;font-weight:700;color:var(--brown)}
.cover-names .hrt{color:var(--rose);font-size:18px;animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.3)}}

/* NAV */
nav{position:sticky;top:0;z-index:200;background:rgba(255,248,242,.94);backdrop-filter:blur(12px);
  border-bottom:1.5px solid var(--blush);display:flex;justify-content:center;flex-wrap:wrap;
  gap:4px;padding:10px 16px;box-shadow:0 2px 16px var(--shadow)}
.nb{background:none;border:2px solid transparent;border-radius:30px;padding:7px 18px;
  font-family:'Noto Sans KR',sans-serif;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;transition:all .2s}
.nb:hover{color:var(--rose);border-color:var(--blush)}
.nb.active{background:var(--rose);color:white;border-color:var(--rose);box-shadow:0 3px 12px rgba(232,114,138,.35)}

/* PAGES */
.page{display:none;max-width:760px;margin:0 auto;padding:32px 16px 80px}
.page.active{display:block;animation:fadeUp .3s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}

/* SECTION TITLE */
.sec-title{font-family:'Playfair Display',serif;font-size:24px;color:var(--brown);margin-bottom:20px;
  display:flex;align-items:center;gap:12px}
.sec-title::after{content:'';flex:1;height:1.5px;background:linear-gradient(90deg,var(--pink),transparent)}

/* CARDS */
.card{background:white;border-radius:var(--radius);padding:20px 22px;
  box-shadow:0 4px 24px var(--shadow),0 1px 0 var(--blush);margin-bottom:16px;
  border:1.5px solid rgba(244,167,185,.2);transition:transform .2s,box-shadow .2s}
.card:hover{transform:translateY(-2px);box-shadow:0 8px 32px var(--shadow)}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:6px;border:none;border-radius:30px;
  padding:9px 20px;font-family:'Noto Sans KR',sans-serif;font-size:13px;font-weight:700;cursor:pointer;transition:all .2s}
.btn-primary{background:var(--rose);color:white;box-shadow:0 3px 12px rgba(232,114,138,.3)}
.btn-primary:hover{background:#d45a75;transform:translateY(-1px)}
.btn-ghost{background:white;color:var(--rose);border:2px solid var(--pink)}
.btn-ghost:hover{background:var(--blush)}
.btn-danger{background:#fff0f0;color:#c04040;border:2px solid #f0c0c0}
.btn-danger:hover{background:#ffe0e0}
.btn-sm{padding:5px 13px;font-size:12px}

/* TRIP CARDS */
.trips-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;margin-bottom:24px}
.trip-card{background:white;border-radius:var(--radius);overflow:hidden;cursor:pointer;
  box-shadow:0 4px 20px var(--shadow);border:1.5px solid var(--blush);transition:all .2s;position:relative}
.trip-card:hover{transform:translateY(-3px);box-shadow:0 8px 32px var(--shadow)}
.trip-card-cover{height:110px;display:flex;align-items:center;justify-content:center;font-size:52px;position:relative}
.trip-card-body{padding:14px 16px 16px}
.trip-card-country{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px}
.trip-card-name{font-family:'Playfair Display',serif;font-size:18px;color:var(--brown);margin-bottom:3px}
.trip-card-date{font-size:11px;color:var(--muted);margin-bottom:10px}
.trip-card-tags{display:flex;flex-wrap:wrap;gap:5px}
.tag{font-size:10px;font-weight:700;padding:2px 9px;border-radius:20px}
.tag-pink{background:#fde8ee;color:var(--rose)}
.tag-sage{background:#e4f0e0;color:#5a8a52}
.tag-gold{background:#fff3d0;color:#a07020}
.tag-lav{background:#eee8f8;color:#7060a0}
.tag-blue{background:#e8f0fe;color:#4060c0}
.status-badge{display:inline-block;font-size:10px;font-weight:700;padding:3px 10px;border-radius:20px;margin-top:8px}
.status-done{background:#e8f8e8;color:#4a8a4a}
.status-plan{background:#fff8e0;color:#c09020}
.status-future{background:#f0e8ff;color:#7060a0}
.trip-card-actions{position:absolute;top:8px;right:8px;display:flex;gap:4px;opacity:0;transition:opacity .2s}
.trip-card:hover .trip-card-actions{opacity:1}
.icon-btn{width:28px;height:28px;border-radius:50%;border:none;cursor:pointer;font-size:13px;
  display:flex;align-items:center;justify-content:center;transition:all .2s}
.icon-btn-edit{background:rgba(255,255,255,.9);color:var(--rose)}
.icon-btn-del{background:rgba(255,240,240,.9);color:#c04040}
.add-trip-card{background:white;border:2.5px dashed var(--pink);border-radius:var(--radius);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:220px;cursor:pointer;transition:all .2s;gap:8px;color:var(--pink)}
.add-trip-card:hover{background:var(--blush);transform:translateY(-2px)}
.add-trip-card .plus{font-size:36px}
.add-trip-card span{font-size:13px;font-weight:700}

/* TRIP DETAIL */
.trip-detail-header{background:linear-gradient(135deg,var(--blush),var(--warm));
  border-radius:var(--radius);padding:24px;margin-bottom:20px;text-align:center;
  border:1.5px solid var(--pink)}
.tdh-emoji{font-size:48px;margin-bottom:10px}
.tdh-name{font-family:'Playfair Display',serif;font-size:26px;color:var(--brown);margin-bottom:4px}
.tdh-meta{font-size:13px;color:var(--muted);margin-bottom:14px}
.tdh-tags{display:flex;flex-wrap:wrap;gap:7px;justify-content:center}
.sub-tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:24px}
.stab{background:white;border:2px solid var(--blush);border-radius:25px;padding:7px 16px;
  font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;transition:all .2s}
.stab:hover{border-color:var(--pink);color:var(--rose)}
.stab.active{background:var(--rose);color:white;border-color:var(--rose)}
.sub-page{display:none}
.sub-page.active{display:block;animation:fadeUp .25s ease both}

/* TIMELINE */
.timeline{position:relative;padding-left:36px}
.timeline::before{content:'';position:absolute;left:12px;top:4px;bottom:4px;width:2px;
  background:linear-gradient(to bottom,var(--pink),var(--peach));border-radius:2px}
.tl-item{position:relative;margin-bottom:10px;background:white;border-radius:14px;
  padding:13px 15px;border:1.5px solid rgba(244,167,185,.25);
  box-shadow:0 2px 12px var(--shadow);cursor:pointer;transition:all .2s}
.tl-item:hover{border-color:var(--pink);transform:translateX(2px)}
.tl-item.open{border-color:var(--rose)}
.tl-dot{position:absolute;left:-28px;top:14px;width:22px;height:22px;border-radius:50%;
  background:var(--rose);color:white;font-size:10px;font-weight:800;
  display:flex;align-items:center;justify-content:center;border:3px solid var(--cream);box-shadow:0 0 0 2px var(--pink)}
.tl-head{display:flex;align-items:center;gap:8px}
.tl-icon{font-size:20px;flex-shrink:0}
.tl-name{font-weight:700;font-size:14px;color:var(--brown);flex:1}
.tl-chevron{color:var(--pink);font-size:12px;transition:transform .2s;flex-shrink:0}
.tl-item.open .tl-chevron{transform:rotate(180deg)}
.tl-body{display:none;margin-top:10px;padding-top:10px;border-top:1px dashed var(--blush)}
.tl-item.open .tl-body{display:block;animation:fadeUp .2s ease}
.tl-note{background:var(--blush);border-radius:8px;padding:8px 12px;font-size:12px;color:#7a4050;margin-top:8px;line-height:1.6}
.transport-row{display:flex;align-items:center;gap:8px;padding:4px 0}
.transport-row hr{flex:1;border:none;border-top:1.5px dashed #f0d0da}
.transport-pill{background:white;border:1.5px solid var(--blush);border-radius:20px;padding:3px 12px;
  font-size:11px;color:var(--muted);font-weight:600;white-space:nowrap}
.cl{list-style:none;display:flex;flex-direction:column;gap:5px}
.cl li{display:flex;align-items:flex-start;gap:8px;font-size:13px;color:#5a3828;line-height:1.4;cursor:pointer}
.cl li.done{opacity:.4}
.cl li.done span{text-decoration:line-through}
.cl li.done .cb{background:var(--rose);border-color:var(--rose)}
.cb{width:16px;height:16px;border-radius:4px;border:2px solid var(--pink);flex-shrink:0;
  display:flex;align-items:center;justify-content:center;transition:all .15s;margin-top:2px;font-size:10px;color:white}
.dg-title{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;margin-bottom:7px;margin-top:10px}

/* PHOTO GRID */
.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.photo-wrap{display:flex;flex-direction:column;gap:4px}
.photo-slot{aspect-ratio:1;background:var(--warm);border-radius:10px;border:2px dashed #f0c8d0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  cursor:pointer;transition:all .2s;overflow:hidden;position:relative;font-size:11px;color:var(--muted);font-weight:600;gap:5px}
.photo-slot:hover{border-color:var(--rose);background:var(--blush)}
.photo-slot img{width:100%;height:100%;object-fit:cover;border-radius:8px}
.photo-slot .ps-emoji{font-size:24px}
.photo-tape{position:absolute;top:-5px;left:50%;transform:translateX(-50%);width:36px;height:12px;border-radius:2px}
.photo-caption{font-size:11px;color:var(--muted);text-align:center;font-style:italic}
.photo-add-row{display:flex;justify-content:center;margin-top:12px}

/* DIARY */
.diary-entry{background:white;border-radius:var(--radius);padding:22px 24px;margin-bottom:14px;
  border:1.5px solid var(--blush);box-shadow:0 4px 20px var(--shadow);position:relative}
.diary-entry::before{content:'"';font-family:'Playfair Display',serif;font-size:72px;color:var(--blush);
  position:absolute;top:-8px;left:14px;line-height:1;pointer-events:none}
.diary-date{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px}
.diary-title{font-family:'Playfair Display',serif;font-size:18px;color:var(--brown);margin-bottom:10px}
.diary-body{font-size:14px;color:#5a3828;line-height:1.9;white-space:pre-wrap}
.diary-mood{display:inline-flex;align-items:center;gap:6px;margin-top:12px;background:var(--blush);
  border-radius:20px;padding:4px 13px;font-size:12px;color:var(--rose);font-weight:700}
.diary-actions{display:flex;gap:6px;margin-top:12px;justify-content:flex-end}

/* EXPENSES */
.exp-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.exp-box{background:white;border-radius:14px;padding:14px 12px;text-align:center;
  border:1.5px solid var(--blush);box-shadow:0 2px 12px var(--shadow)}
.exp-amount{font-family:'Playfair Display',serif;font-size:20px;font-weight:700;color:var(--rose)}
.exp-label{font-size:10px;color:var(--muted);margin-top:2px}
table.exp-table{width:100%;border-collapse:collapse;background:white;border-radius:14px;overflow:hidden;
  box-shadow:0 2px 16px var(--shadow)}
table.exp-table th{background:linear-gradient(135deg,var(--rose),#d45a75);color:white;font-size:12px;font-weight:700;padding:10px 13px;text-align:left}
table.exp-table td{padding:10px 13px;font-size:13px;color:#5a3828;border-bottom:1px solid var(--blush)}
table.exp-table tr:last-child td{border:none}
table.exp-table tr:hover td{background:var(--warm)}
.exp-cat-badge{display:inline-block;font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px}
.exp-total-row td{font-weight:800;color:var(--rose);font-size:13px;background:var(--blush)!important}
.exp-actions{display:flex;gap:4px}

/* MODAL */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(60,20,10,.45);z-index:1000;
  align-items:center;justify-content:center;padding:16px}
.modal-overlay.open{display:flex;animation:fadeIn .2s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{background:white;border-radius:20px;padding:28px 24px;width:100%;max-width:480px;
  box-shadow:0 20px 60px rgba(0,0,0,.2);max-height:90vh;overflow-y:auto}
.modal h3{font-family:'Playfair Display',serif;font-size:20px;color:var(--brown);margin-bottom:20px}
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:5px;text-transform:uppercase;letter-spacing:.5px}
.form-group input,.form-group textarea,.form-group select{
  width:100%;border:2px solid var(--blush);border-radius:10px;padding:10px 13px;
  font-family:'Noto Sans KR',sans-serif;font-size:14px;color:var(--ink);background:white;
  transition:border-color .2s;outline:none}
.form-group input:focus,.form-group textarea:focus,.form-group select:focus{border-color:var(--rose)}
.form-group textarea{resize:vertical;min-height:90px;line-height:1.6}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:20px}
.emoji-picker{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.ep-btn{width:36px;height:36px;border:2px solid var(--blush);border-radius:8px;
  font-size:18px;cursor:pointer;transition:all .2s;background:white}
.ep-btn:hover,.ep-btn.selected{border-color:var(--rose);background:var(--blush)}

/* MEMO */
.memo-box{background:#fffde8;border:2px dashed #f0d060;border-radius:14px;padding:18px 20px;margin-bottom:16px;
  box-shadow:3px 3px 0 rgba(240,208,96,.2)}
.memo-box h3{font-family:'Gaegu',cursive;font-size:17px;color:#8a7020;margin-bottom:10px}
.memo-box ul{list-style:none;display:flex;flex-direction:column;gap:7px}
.memo-box li{font-size:13px;color:#6a5820;display:flex;align-items:center;gap:7px}
.memo-box li::before{content:'✓';color:var(--rose);font-weight:800}

/* FOOTER */
footer{text-align:center;padding:28px 20px;border-top:2px dashed var(--pink);
  font-family:'Gaegu',cursive;font-size:17px;color:#c0a090}

/* UTILS */
.flex-gap{display:flex;gap:8px;flex-wrap:wrap}
.mt-8{margin-top:8px}
.mt-16{margin-top:16px}
.text-center{text-align:center}
.empty-state{text-align:center;padding:40px 20px;color:var(--muted)}
.empty-state .es-emoji{font-size:40px;margin-bottom:10px}
.empty-state p{font-size:14px}

@media(max-width:480px){
  .photo-grid{grid-template-columns:repeat(2,1fr)}
  .exp-summary{grid-template-columns:repeat(2,1fr)}
  .form-row{grid-template-columns:1fr}
  .trips-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>

<div class="cover">
  <div class="cover-eyebrow">✈️ Our Private Travel Book ✈️</div>
  <h1 class="cover-title">Our <em>Story</em></h1>
  <p class="cover-sub">우리 둘만의 여행 기록 💕</p>
  <div class="cover-names">
    <span id="name1-display">My Love</span>
    <span class="hrt">♡</span>
    <span id="name2-display">Me</span>
  </div>
</div>

<nav>
  <button class="nb active" onclick="goPage('home',this)">🏠 홈</button>
  <button class="nb" onclick="goPage('trips',this)">✈️ 여행</button>
  <button class="nb" onclick="goPage('settings',this)">⚙️ 설정</button>
</nav>

<main>

<!-- HOME -->
<div class="page active" id="page-home">
  <div class="sec-title">💕 우리의 여행 기록</div>
  <div id="home-stats" class="flex-gap" style="margin-bottom:20px"></div>
  <div id="home-recent"></div>
  <div class="memo-box">
    <h3>📌 우리의 버킷리스트</h3>
    <ul id="home-bucketlist"></ul>
  </div>
</div>

<!-- TRIPS LIST -->
<div class="page" id="page-trips">
  <div class="sec-title">✈️ 모든 여행</div>
  <div class="trips-grid" id="trips-grid"></div>
</div>

<!-- TRIP DETAIL -->
<div class="page" id="page-trip-detail">
  <button class="btn btn-ghost btn-sm" onclick="goPage('trips',document.querySelector('.nb:nth-child(2)'));renderTrips()" style="margin-bottom:16px">← 목록으로</button>
  <div id="trip-detail-content"></div>
</div>

<!-- SETTINGS -->
<div class="page" id="page-settings">
  <div class="sec-title">⚙️ 설정</div>
  <div class="card">
    <div class="form-group">
      <label>커플 이름 1</label>
      <input type="text" id="set-name1" placeholder="이름 입력"/>
    </div>
    <div class="form-group">
      <label>커플 이름 2</label>
      <input type="text" id="set-name2" placeholder="이름 입력"/>
    </div>
    <div class="form-group">
      <label>버킷리스트 (줄바꿈으로 구분)</label>
      <textarea id="set-bucketlist" rows="5" placeholder="도쿄&#10;발리&#10;파리"></textarea>
    </div>
    <button class="btn btn-primary" onclick="saveSettings()">저장하기 💕</button>
  </div>
  <div class="card mt-16" style="border-color:#f0c0c0">
    <div style="font-size:13px;color:#c04040;margin-bottom:10px;font-weight:700">⚠️ 데이터 초기화</div>
    <div style="font-size:12px;color:var(--muted);margin-bottom:12px">모든 여행 기록이 삭제돼요. 신중하게!</div>
    <button class="btn btn-danger btn-sm" onclick="resetAll()">전체 초기화</button>
  </div>
</div>

</main>

<footer>우리 둘만의 기록 — 영원히 💕<br/><span style="font-size:12px;opacity:.6">Our Travel Book ✈️</span></footer>

<!-- ══ MODALS ══ -->

<!-- Trip Modal -->
<div class="modal-overlay" id="modal-trip">
  <div class="modal">
    <h3 id="modal-trip-title">새 여행 추가</h3>
    <div class="form-group">
      <label>여행 이름</label>
      <input type="text" id="ti-name" placeholder="예: 오사카 난바"/>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>나라 / 도시</label>
        <input type="text" id="ti-country" placeholder="예: 🇯🇵 일본"/>
      </div>
      <div class="form-group">
        <label>날짜</label>
        <input type="text" id="ti-date" placeholder="예: 2025년 봄"/>
      </div>
    </div>
    <div class="form-group">
      <label>이모지</label>
      <div class="emoji-picker" id="trip-emoji-picker"></div>
    </div>
    <div class="form-group">
      <label>상태</label>
      <select id="ti-status">
        <option value="done">✅ 다녀왔어요</option>
        <option value="plan">🌟 계획 중</option>
        <option value="future">💭 가고 싶어요</option>
      </select>
    </div>
    <div class="form-group">
      <label>태그 (쉼표로 구분)</label>
      <input type="text" id="ti-tags" placeholder="예: 쇼핑, 맛집, 위스키"/>
    </div>
    <div class="form-group">

// ── RATES (AED base) ──
const RATES_TO_KRW = { AED:370, JPY:9.3, KRW:1, USD:1360, EUR:1480, CZK:61, THB:39 };
const RATES_TO_AED = { AED:1, JPY:0.025, KRW:0.0027, USD:3.67, EUR:3.98, CZK:0.165, THB:0.105 };

function toKRW(amount, currency){ return Math.round(amount * (RATES_TO_KRW[currency]||1)); }
function toAED(amount, currency){ return (amount * (RATES_TO_AED[currency]||1)).toFixed(2); }

function uid(){ return 'id_' + Math.random().toString(36).slice(2,9); }

// ── PAGE NAV ──
window.goPage = function(id, btn){

  document.getElementById('page-'+id).classList.add('active');
  if(btn) btn.classList.add('active');
  window.scrollTo({top:0,behavior:'smooth'});
};

// ── HOME ──

// ── OPEN TRIP ──
window.openTrip = function(id){
  currentTripId = id;
  currentSubTab = 'route';
  const trip = DB.trips.find(t=>t.id===id);
  if(!trip) return;
  document.querySelectorAll('.nb').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById('page-trip-detail').classList.add('active');
  renderTripDetail(trip);
  window.scrollTo({top:0,behavior:'smooth'});
};

function renderTripDetail(trip){
  const statusLabel = {done:'✅ 다녀왔어요', plan:'🌟 계획 중', future:'💭 가고 싶어요'};
  const tabs = [{id:'route',label:'🗺️ 동선'},{id:'photos',label:'📷 사진첩'},{id:'diary',label:'📖 일기'},{id:'expenses',label:'💴 지출'}];
  document.getElementById('trip-detail-content').innerHTML = `
    <div class="trip-detail-header">
      <div class="tdh-emoji">${trip.emoji}</div>
      <div class="tdh-name">${trip.name}</div>
      <div class="tdh-meta">${trip.country} · ${trip.date} · ${statusLabel[trip.status]}</div>
      <div class="tdh-tags">${trip.tags.map(t=>`<span class="tag tag-pink">${t}</span>`).join('')}</div>
    </div>
    <div class="sub-tabs">${tabs.map(t=>`<button class="stab ${t.id===currentSubTab?'active':''}" onclick="switchSub('${t.id}',this)">${t.label}</button>`).join('')}</div>
    <div id="sub-route" class="sub-page ${currentSubTab==='route'?'active':''}"></div>
    <div id="sub-photos" class="sub-page ${currentSubTab==='photos'?'active':''}"></div>
    <div id="sub-diary" class="sub-page ${currentSubTab==='diary'?'active':''}"></div>
    <div id="sub-expenses" class="sub-page ${currentSubTab==='expenses'?'active':''}"></div>
  `;
  renderRoute(trip);
  renderPhotos(trip);
  renderDiary(trip);
  renderExpenses(trip);
}

window.switchSub = function(id, btn){
  currentSubTab = id;
  document.querySelectorAll('.stab').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('.sub-page').forEach(p=>p.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('sub-'+id).classList.add('active');
};

// ── ROUTE ──
function renderRoute(trip){
  const el = document.getElementById('sub-route');
  const catColors = {쇼핑:'tag-pink',식사:'tag-peach',관광:'tag-sage',이동:'tag-lav',숙박:'tag-lav',위스키:'tag-gold',기타:'tag-blue'};
  if(!trip.stops.length){
    el.innerHTML = `<div class="empty-state"><div class="es-emoji">🗺️</div><p>아직 동선이 없어요<br/>추가해봐요!</p></div>`;
  } else {
    el.innerHTML = `<div class="timeline">${trip.stops.map((s,i)=>{
      const trans = s.transport ? `<div class="transport-row"><hr/><div class="transport-pill">${s.transport}</div><hr/></div>` : '';
      let body = '';
      if(s.todo?.length){ body += `<div class="dg-title">✅ 할 것</div><ul class="cl">${s.todo.map((item,j)=>`<li onclick="this.classList.toggle('done')"><div class="cb">✓</div><span>${item}</span></li>`).join('')}</ul>`; }
      if(s.buy?.length){ body += `<div class="dg-title">🛍️ 살 것</div><ul class="cl">${s.buy.map(item=>`<li onclick="this.classList.toggle('done')"><div class="cb">✓</div><span>${item}</span></li>`).join('')}</ul>`; }
      if(s.eat?.length){ body += `<div class="dg-title">🍽️ 먹을 것</div><ul class="cl">${s.eat.map(item=>`<li onclick="this.classList.toggle('done')"><div class="cb">✓</div><span>${item}</span></li>`).join('')}</ul>`; }
      if(s.note){ body += `<div class="tl-note">💡 ${s.note}</div>`; }
      return `${i>0?trans:''}
        <div class="tl-item" id="tl-${s.id}" onclick="toggleTl('${s.id}')">
          <div class="tl-dot">${i+1}</div>
          <div class="tl-head">
            <span class="tl-icon">${s.icon}</span>
            <span class="tl-name">${s.name}</span>
            ${s.time?`<span style="font-size:11px;color:#aaa">${s.time}</span>`:''}
            <span class="tag ${catColors[s.cat]||'tag-blue'} tl-badge" style="font-size:10px;padding:2px 8px">${s.cat}</span>
            <span class="tl-chevron">▼</span>
          </div>
          <div class="tl-body">${body}
            <div class="flex-gap mt-8">
              <button class="btn btn-ghost btn-sm" onclick="event.stopPropagation();editStop('${s.id}')">✏️ 수정</button>
              <button class="btn btn-danger btn-sm" onclick="event.stopPropagation();deleteStop('${s.id}')">🗑️ 삭제</button>
            </div>
          </div>
        </div>`;
    }).join('')}</div>`;
  }
  el.innerHTML += `<div class="flex-gap mt-16"><button class="btn btn-primary" onclick="openStopModal()">＋ 장소 추가</button></div>`;
}

window.toggleTl = function(id){
  const el = document.getElementById('tl-'+id);
  if(!el) return;
  const open = el.classList.contains('open');
  document.querySelectorAll('.tl-item').forEach(e=>e.classList.remove('open'));
  if(!open) el.classList.add('open');
};

window.addPhoto = function(){

// ── EXPENSES ──
function renderExpenses(trip){
  const el = document.getElementById('sub-expenses');
  const exps = trip.expenses||[];
  const byCurrency = {};
  exps.forEach(e=>{
    if(!byCurrency[e.currency]) byCurrency[e.currency]=0;
    byCurrency[e.currency]+=e.amount;
  });
  const totalKRW = exps.reduce((s,e)=>s+toKRW(e.amount,e.currency),0);
  const totalAED = exps.reduce((s,e)=>s+parseFloat(toAED(e.amount,e.currency)),0).toFixed(2);

  const summaryBoxes = [
    `<div class="exp-box"><div class="exp-amount">₩${totalKRW.toLocaleString()}</div><div class="exp-label">총액 (원화 환산)</div></div>`,
    `<div class="exp-box"><div class="exp-amount">AED ${totalAED}</div><div class="exp-label">총액 (디르함 환산)</div></div>`,
    ...Object.entries(byCurrency).map(([cur,amt])=>`<div class="exp-box"><div class="exp-amount" style="font-size:16px">${cur} ${amt.toLocaleString()}</div><div class="exp-label">실제 지출</div></div>`)
  ];

  el.innerHTML = `<div class="exp-summary">${summaryBoxes.join('')}</div>`;

  if(exps.length){
    el.innerHTML += `<table class="exp-table">
      <thead><tr><th>항목</th><th>카테고리</th><th>금액</th><th>₩환산</th><th></th></tr></thead>
      <tbody>${exps.map(e=>`<tr>
        <td>${e.name}${e.note?`<br/><span style="font-size:11px;color:#aaa">${e.note}</span>`:''}</td>
        <td><span class="exp-cat-badge tag-pink">${e.cat}</span></td>
        <td style="font-weight:600">${e.currency} ${e.amount.toLocaleString()}</td>
        <td style="font-size:12px;color:var(--muted)">₩${toKRW(e.amount,e.currency).toLocaleString()}</td>
        <td><div class="exp-actions">
          <button class="icon-btn icon-btn-edit" onclick="editExpense('${e.id}')">✏️</button>
          <button class="icon-btn icon-btn-del" onclick="deleteExpense('${e.id}')">🗑️</button>
        </div></td>
      </tr>`).join('')}
      <tr class="exp-total-row"><td colspan="2">💴 합계</td>
        <td colspan="2">₩ ${totalKRW.toLocaleString()} · AED ${totalAED}</td><td></td></tr>
      </tbody></table>`;
  } else {
    el.innerHTML += `<div class="empty-state"><div class="es-emoji">💴</div><p>아직 지출 내역이 없어요</p></div>`;
  }
  el.innerHTML += `<div class="flex-gap mt-16"><button class="btn btn-primary" onclick="openExpenseModal()">＋ 지출 추가</button></div>
  <div style="font-size:11px;color:var(--muted);margin-top:8px">💡 환율: 1 AED ≈ ₩370 · 1 JPY ≈ ₩9.3 (참고용)</div>`;
}

// ── TRIP MODAL ──
window.openTripModal = function(){
  editingId = null;
  document.getElementById('modal-trip-title').textContent = '새 여행 추가 ✈️';
  ['ti-name','ti-country','ti-date','ti-tags'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('ti-status').value='plan';
  document.getElementById('ti-color').value='linear-gradient(135deg,#fde8d0,#f9c784)';
  renderEmojiPicker('trip-emoji-picker', '🗾');
  openModal('modal-trip');
};

window.editTrip = function(id){
  editingId = id;
  const t = DB.trips.find(x=>x.id===id);
  if(!t) return;
  document.getElementById('modal-trip-title').textContent = '여행 수정 ✏️';
  document.getElementById('ti-name').value = t.name;
  document.getElementById('ti-country').value = t.country;
  document.getElementById('ti-date').value = t.date;
  document.getElementById('ti-status').value = t.status;
  document.getElementById('ti-tags').value = t.tags.join(', ');
  document.getElementById('ti-color').value = t.color;
  renderEmojiPicker('trip-emoji-picker', t.emoji);
  openModal('modal-trip');
};

window.saveTrip = function(){
  const name = document.getElementById('ti-name').value.trim();
  if(!name){ alert('여행 이름을 입력해주세요!'); return; }
  const data = {
    name, country:document.getElementById('ti-country').value.trim()||'미정',
    date:document.getElementById('ti-date').value.trim()||'날짜 미정',
    emoji:document.querySelector('.ep-btn.selected')?.textContent||'✈️',
    color:document.getElementById('ti-color').value,
    status:document.getElementById('ti-status').value,
    tags:document.getElementById('ti-tags').value.split(',').map(t=>t.trim()).filter(Boolean)
  };
  if(editingId){
    const t = DB.trips.find(x=>x.id===editingId);
    Object.assign(t, data);
  } else {
    DB.trips.push({id:uid(),...data,stops:[],diary:[],expenses:[],photos:[]});
  }
  save(); closeModal('modal-trip'); renderTrips(); renderHome();
};

window.deleteTrip = function(id){
  if(!confirm('이 여행을 삭제할까요?')) return;
  DB.trips = DB.trips.filter(t=>t.id!==id);
  save(); renderTrips(); renderHome();
};

function renderEmojiPicker(containerId, selected){
  const c = document.getElementById(containerId);
  c.innerHTML = EMOJIS.map(e=>`<button class="ep-btn ${e===selected?'selected':''}" onclick="selectEmoji(this,'${containerId}')" type="button">${e}</button>`).join('');
}
window.selectEmoji = function(btn, containerId){
  document.querySelectorAll(`#${containerId} .ep-btn`).forEach(b=>b.classList.remove('selected'));
  btn.classList.add('selected');
};

function openModal(id){ document.getElementById(id).classList.add('open'); }

document.querySelectorAll('.modal-overlay').forEach(m=>{
  m.addEventListener('click',e=>{ if(e.target===m) m.classList.remove('open'); });
